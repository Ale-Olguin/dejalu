name: Build DejaLu (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Esquema de Xcode a compilar"
        default: "DejaLu"
        required: true

jobs:
  build:
    runs-on: macos-14   # runner arm64 (Apple Silicon) con Xcode preinstalado
    timeout-minutes: 90

    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Node + dependencias de build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g uglify-js clean-css-cli

      - name: Parchar HockeySDK (sin crash reporter, que es solo Intel)
        run: |
          # 1) Reemplazar la librería solo-Intel por un stub arm64+x86_64 con las 3 clases
          #    que BITCrashManager necesita para enlazar. No se usan en runtime (ver paso 2).
          LIB=third-party/HockeySDK-Mac/Vendor/CrashReporter/libCrashReporter-MacOSX-Static.a
          mkdir -p /tmp/stub && cd /tmp/stub
          cat > stub.m << 'STUB'
          #import <Foundation/Foundation.h>
          @interface BITPLCrashReport : NSObject
          @end
          @implementation BITPLCrashReport
          @end
          @interface BITPLCrashReporter : NSObject
          @end
          @implementation BITPLCrashReporter
          @end
          @interface BITPLCrashReporterConfig : NSObject
          @end
          @implementation BITPLCrashReporterConfig
          @end
          STUB
          clang -arch arm64 -arch x86_64 -c stub.m -o stub.o
          cd "$GITHUB_WORKSPACE"
          libtool -static -o "$LIB" /tmp/stub/stub.o
          lipo -info "$LIB"

          # 2) Quitar de la app las llamadas a HockeyApp (servicio discontinuado)
          F=Sources/UI/application/DJLAppDelegate.mm
          sed -i '' '/BITHockeyManager sharedHockeyManager\]/d' "$F"
          echo "--- líneas de Hockey que quedan en $F ---"
          grep -n "Hockey" "$F" || true

      - name: Compilar para arm64
        run: |
          set -o pipefail
          xcodebuild \
            -project dejalu.xcodeproj \
            -scheme "${{ github.event.inputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Firma ad hoc (necesaria para correr en Apple Silicon)
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          lipo -archs "$APP/Contents/MacOS/"* || true
          ditto -c -k --keepParent "$APP" DejaLu-arm64.zip

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: DejaLu-arm64
          path: DejaLu-arm64.zip

      - name: Subir log (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
